<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divine Battle - Ludo Tournament</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101526;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px 12px;
      background: #202b49;
      border-bottom: 2px solid #f5b82e;
    }
    h1 { color: #ffc83d; margin-bottom: 8px; }
    main { padding: 35px 16px; }
    .panel {
      max-width: 500px;
      margin: 20px auto;
      padding: 24px;
      background: #202b49;
      border-radius: 16px;
    }
    button {
      background: #ffc83d;
      color: #111827;
      border: 0;
      padding: 13px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    footer { padding: 20px; color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <h1>⚔️ DIVINE BATTLE ⚔️</h1>
    <p>Ludo Tournament Platform</p>
  </header>
  <main>
    <div class="panel">
      <h2>Welcome to Divine Battle</h2>
      <p>Apne Ludo tournament ke liye taiyar ho jaiye!</p>
      <p>यह हमारी वेबसाइट का शुरुआती होमपेज है।</p>
      <button onclick="alert('Tournament feature jaldi aayega!')">
        Explore Tournaments
      </button>
    </div>
  </main>
  <footer>© 2026 Divine Battle</footer>
</body>
</html>
